; Opt-in candidate, not a measured 60 FPS preset. Back up totk.ini before merging these keys.
; Keep the current recorder/replay/TDP settings; restart after applying display changes.
[display]
output_res = 1280x800
; Scene scale uses the engine patches; existing dynamic-resolution tiers remain enabled.
render_scale = 67
; Presentation FSR runs only when the final crop is smaller than the destination.
; A native 1280x800 final image bypasses it even with a smaller internal scene.
upscaler = fsr
sharpness = 80
shadow_res = 512
; Contact shadows are already off by default; this preserves that setting.
contact_shadows = 0
; Lower scene detail and softer shadows are expected. No original game resources are modified.
[frame rate]
fps_limit = 60
